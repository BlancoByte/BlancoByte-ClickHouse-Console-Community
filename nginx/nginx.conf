user nginx;
worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 75s;
    client_max_body_size 50m;

    # Gzip the SPA & JSON responses
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2;

    # Optional Brotli — typically 15-20% smaller than gzip for the large
    # single-file index.html. Requires the ngx_brotli module to be built/
    # loaded (e.g. `load_module modules/ngx_brotli_filter_module.so;` at the
    # top of this file). Left commented so the config stays valid on stock
    # nginx; uncomment after installing the module.
    # brotli            on;
    # brotli_comp_level 5;
    # brotli_types      text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml font/woff2;

    # Plain HTTP → redirect to HTTPS
    server {
        listen 80;
        server_name _;
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Content-Security-Policy is set by the application (app.py) because the
        # script-src now carries a per-request nonce that must match the inline
        # <script> in each served page — see _csp_policy / _serve_index. The
        # remaining security headers stay here at the edge.
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

        location / {
            proxy_pass         http://app:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    # Map for websocket support (future-proofing)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}
