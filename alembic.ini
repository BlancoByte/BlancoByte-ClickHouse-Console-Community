# alembic.ini — Postgres schema migrations for ClickHouse Console.
#
# The database URL is NOT stored here. It is built at runtime in
# migrations/env.py from the same DB_HOST / DB_PORT / DB_USER / DB_PASSWORD /
# DB_NAME environment variables the application itself uses, so there is a
# single source of connection truth and no credentials live in this file.
#
# Usage:
#   alembic upgrade head        # apply all pending migrations (deploy step)
#   alembic current             # show the DB's current revision
#   alembic history             # list migrations
#   alembic downgrade -1        # roll back one migration (where supported)

[alembic]
script_location = migrations
prepend_sys_path = .
# Intentionally blank — env.py injects the URL from the environment.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
