name: CI

# Runs the same validation gate that used to be manual, on every push/PR,
# so syntax/structure regressions are caught before a release is bundled.
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lint tools (optional)
        run: pip install pyflakes || true

      - name: Validate (Python + JS syntax)
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh

